name: Tani - Kaynak Erisimi

# Kaynaklara hangi yontemle erisilebildigini olcer.
# Tani dosyasi her degistiginde otomatik calisir.
on:
  workflow_dispatch:
  push:
    paths:
      - 'toplayici/test/tani-*.js'

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kaynak erisim tanisi
        run: node toplayici/test/tani-tff.js
