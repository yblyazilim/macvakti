name: Veri Topla

# Tek dongu, 15 dakikada bir. Mac verisi her seferinde tazelenir.
# Yayin akisi akilli davranir: mac saati yaklasiyorsa 15 dakikada bir,
# sakin donemde 6 saatte bir indirilir.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

  # Kod degistiginde de calis. toplayici/veri disarida tutulur; aksi halde
  # botun kendi veri commiti yeni bir calisma tetikler ve sonsuz dongu olur.
  push:
    branches: [main]
    paths-ignore:
      - 'toplayici/veri/**'
      - '**.md'

concurrency:
  group: veri-topla
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dogrulama testleri
        run: node toplayici/test/dogrula.js

      - name: Veriyi topla
        id: topla
        run: node toplayici/src/topla.js
        continue-on-error: true

      - name: Saglik kontrolu
        id: saglik
        run: node toplayici/src/saglik.js
        continue-on-error: true

      - name: Degisiklik varsa yayinla
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "macvakti-bot"
          git config user.email "bot@users.noreply.github.com"
          # Uzaktaki son hali temel al. REBASE KULLANMIYORUZ: uretilen veri
          # dosyalari uzaktakiyle her zaman catisir ve rebase yarida kalirdi.
          # Bunun yerine HEAD uzaga tasinir, sadece veri klasoru commit edilir.
          git fetch origin main
          git reset --mixed origin/main
          git add toplayici/veri
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "veri: otomatik guncelleme"
          git push origin HEAD:main

      - name: Toplama basarisizsa uyar
        if: steps.topla.outcome == 'failure'
        run: |
          echo "::warning::Veri toplama hata verdi."
          exit 1

      - name: Saglik kirmizi ise uyar
        if: steps.saglik.outcome == 'failure'
        run: |
          echo "::error::Saglik kontrolu kirmizi."
          exit 1
